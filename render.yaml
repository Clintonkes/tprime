services:
  - type: web
    name: tprime
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render will automatically set RENDER_EXTERNAL_URL to the service's public URL
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
