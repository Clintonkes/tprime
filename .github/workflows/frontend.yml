name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - run: npm ci

      - name: Build (vite + prerender)
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # The prerender script writes static HTML to .output/public.
      # Copy index.html → 404.html so GitHub Pages serves the SPA shell
      # for any deep-link (e.g. /services, /book, /admin).
      - name: Create SPA 404 fallback
        run: cp .output/public/index.html .output/public/404.html

      # Custom domain — tells GitHub Pages to serve this site at tprimelawncare.org
      - name: Write CNAME
        run: echo "tprimelawncare.org" > .output/public/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: UI/.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
